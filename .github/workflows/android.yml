# يبني تطبيق أندرويد (APK للتثبيت المباشر، وAAB لـ Google Play) من نفس ملفات الويب.
# مع كل دفعة إلى main أو فروع claude/: يُنشر الـ APK في صفحة Releases، ورابط التحميل الثابت:
#   https://github.com/<owner>/<repo>/releases/latest/download/flowpay.apk
# الدفع إلى أي فرع آخر يبني فقط، ويرفع الـ APK كـ artifact للتجربة.
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      # التوقيع: كل نسخة يجب أن تُوقَّع بنفس المفتاح وإلا رفض الجوال التحديث («التطبيق غير مثبت»).
      #  1) المفتاح الدائم من أسرار المستودع: ANDROID_KEYSTORE_B64 و ANDROID_KEYSTORE_PASSWORD
      #     (ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD اختياريان: flowpay ونفس كلمة السر).
      #  2) بدونه: مفتاح تجريبي يُنشأ مرة واحدة ويُحفظ في كاش GitHub. لا يصلح للنشر —
      #     الكاش يُحذف بعد 7 أيام بلا بناء، وعندها يتغير المفتاح.
      - name: Require the signing key on main
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets before releasing (see README)."
            exit 1
          fi
      - name: Restore the test signing key
        id: testkey
        uses: actions/cache@v4
        with:
          path: ~/.flowpay-ci/test.jks
          key: flowpay-test-keystore-v1
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Signing with the permanent key from repository secrets"
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=${KEY_ALIAS:-flowpay}"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No permanent signing key in secrets — using the cached test key"
            mkdir -p ~/.flowpay-ci
            if [ ! -f ~/.flowpay-ci/test.jks ]; then
              keytool -genkeypair -keystore ~/.flowpay-ci/test.jks -alias flowpay -storepass flowpay-test -keypass flowpay-test \
                -dname "CN=FlowPay Test" -keyalg RSA -keysize 2048 -validity 10000
            fi
            {
              echo "KEYSTORE_FILE=$HOME/.flowpay-ci/test.jks"
              echo "KEYSTORE_PASSWORD=flowpay-test"
              echo "KEY_ALIAS=flowpay"
              echo "KEY_PASSWORD=flowpay-test"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - run: |
          cp android/app/build/outputs/apk/release/app-release.apk flowpay.apk
          cp android/app/build/outputs/bundle/release/app-release.aab flowpay.aab
      - uses: actions/upload-artifact@v4
        with:
          name: flowpay-android
          path: |
            flowpay.apk
            flowpay.aab

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowpay-android
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: فلو باي لأندرويد — نسخة ${{ github.run_number }}
          body: |
            حمّل `flowpay.apk` على الجوال وثبّته. التحديث يُثبَّت فوق النسخة السابقة ولا يمسح المستفيدين ولا السجل.
            رابط ثابت لآخر نسخة دائمًا: https://github.com/${{ github.repository }}/releases/latest/download/flowpay.apk
            `flowpay.aab` للرفع على Google Play Console.
          files: |
            flowpay.apk
            flowpay.aab
          make_latest: true
